<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-gOfN8h6cliMSKU4TFoMI8XSJknA3dGtuqOJoZUVWxtU='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>LeoClips | Autorización Facebook</title><style>html,body{background:#090b10;color:#f3f5ff;font-family:system-ui,sans-serif;margin:0}main{max-width:550px;margin:16vh auto;padding:24px}</style></head><body><main><h1>LeoClips · Facebook</h1><p id="message">Devolviendo autorización al programa de Windows…</p><p>Si no se completa, abre LeoClips y vuelve a conectar la cuenta. No compartas esta URL.</p></main><script>(()=>{const p=new URLSearchParams(location.search),next=new URLSearchParams();for(const k of ['code','state','error','error_reason','error_description'])if(p.has(k)&&p.getAll(k).length===1)next.set(k,p.get(k));if(!next.has('state')||(!next.has('code')&&!next.has('error'))){document.getElementById('message').textContent='Respuesta de autorización no válida. Regresa a LeoClips.';return;}location.replace('http://127.0.0.1:3456/callback/?'+next.toString());})();</script></body></html>
